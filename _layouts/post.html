---
layout: default
---
<article class="article">
  <a class="eyebrow back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
  <header class="article-header">
    <p class="eyebrow">WRITING <span class="dot-separator">/</span> <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="lede">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <div class="article-end"><a href="{{ '/blog/' | relative_url }}">← Back to all posts</a></div>
</article>
