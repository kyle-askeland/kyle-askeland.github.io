<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">Kyle Askeland<span class="brand-dot">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' %}aria-current="page"{% endif %}>Projects</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} Kyle Askeland</span>
      <span><a href="https://github.com/kyle-askeland" rel="me">GitHub</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></span>
    </footer>
  </div>
</body>
</html>
